server {
    listen 443 ssl;
    server_name orientir.178-255-126-110.sslip.io;
    ssl_certificate /etc/letsencrypt/live/orientir.178-255-126-110.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orientir.178-255-126-110.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 32k;
    client_body_buffer_size 32k;
    client_body_in_file_only off;
    client_header_timeout 15s;
    client_body_timeout 15s;
    if ($host != orientir.178-255-126-110.sslip.io) { return 400; }
    error_page 413 = @too_large;
    error_page 502 504 = @unavailable;
    location @too_large {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        return 413 "Form too large. No changes confirmed.\n";
    }
    location @unavailable {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        return 503 "Temporarily unavailable. No changes confirmed.\n";
    }
    location / {
        proxy_pass http://127.0.0.1:4365;
        proxy_set_header Host $http_host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_next_upstream off;
    }
}
