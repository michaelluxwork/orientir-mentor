server {
    listen 80;
    server_name orientir.178-255-126-110.sslip.io;
    access_log off;
    error_log /dev/null crit;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/orientir-acme;
    }
    location / {
        return 301 https://orientir.178-255-126-110.sslip.io$request_uri;
    }
}
