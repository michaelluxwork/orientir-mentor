{% if page.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Страницы списка">{% if page.has_previous %}<a class="button" href="?page={{ page.previous_page_number }}{% if q %}&amp;q={{ q|urlencode }}{% endif %}">← Назад</a>{% endif %}<span>Страница {{ page.number }} из {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="button" href="?page={{ page.next_page_number }}{% if q %}&amp;q={{ q|urlencode }}{% endif %}">Дальше →</a>{% endif %}</nav>{% endif %}
